# Simulação do abrigo no Wokwi (extensão do VS Code).
# O .bin do MicroPython não vai para o Git: ./wokwi.sh preparar baixa.
[wokwi]
version = 1
firmware = "ESP32_GENERIC-20260824-v1.29.0.bin"
elf = "ESP32_GENERIC-20260824-v1.29.0.bin"
# porta serial exposta pelo simulador, usada pelo mpremote para enviar o main.py
rfc2217ServerPort = 4000
