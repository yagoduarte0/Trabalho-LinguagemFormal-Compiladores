# Simulação do abrigo no Wokwi (extensão do VS Code).
# O .bin do MicroPython não vai para o Git: ./wokwi.sh preparar baixa.
[wokwi]
version = 1
firmware = "ESP32_GENERIC-20260824-v1.29.0.bin"
elf = "ESP32_GENERIC-20260824-v1.29.0.bin"
# porta serial exposta pelo simulador, usada pelo mpremote para enviar o firmware
rfc2217ServerPort = 4000

# painel web do abrigo: a porta 80 da placa simulada aparece no Mac em
# http://localhost:8180 (a placa precisa estar conectada ao Wokwi-GUEST)
[[net.forward]]
from = "localhost:8180"
to = "target:80"
