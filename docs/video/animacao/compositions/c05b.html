<!-- Cena 05b — fumaça. Close na cozinha com a fumaça subindo e, ao lado,
     a leitura do MQ-2 em tempo real: bruta (com ruído), média móvel, a base
     de ar limpo aprendida no aquecimento e o limite base + 800
     (MARGEM_FUMACA). Quando a média cruza o limite: ALARME, LED vermelho,
     sirene de dois tons e o exaustor ligado pelo relé. -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; }
    #c05b-mundo { left: 160px; top: 1300px; }
    #c05b-graf { position: absolute; right: 60px; top: 190px; width: 760px; height: 600px; padding: 22px 26px;
      border: 2px solid rgba(200, 184, 138, 0.4); border-radius: 10px; background: rgba(13, 17, 12, 0.95); }
    #c05b-graf svg { position: absolute; left: 26px; top: 70px; width: 708px; height: 440px; overflow: visible; }
    #c05b-leg { position: absolute; left: 26px; bottom: 20px; display: flex; gap: 22px; font-family: "JetBrains Mono", monospace; font-size: 18px; color: #c8b88a; }
    #c05b-leg i { display: inline-block; width: 22px; height: 4px; margin-right: 8px; vertical-align: middle; }
    #c05b-valor { position: absolute; right: 26px; top: 16px; font-family: "JetBrains Mono", monospace; font-size: 30px; color: #ede4cc; }
    #c05b-alarme { position: absolute; left: 0; right: 0; top: 820px; text-align: center; }
    #c05b-alarme .t { font-family: "League Gothic", sans-serif; font-size: 120px; letter-spacing: 0.08em; color: #ef5a4c; line-height: 1; }
    #c05b-veu { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, transparent 45%, rgba(239, 90, 76, 0.35) 100%); }
    .c05b-rot { position: absolute; font-family: "JetBrains Mono", monospace; font-size: 26px; white-space: nowrap; padding: 6px 14px; background: rgba(10, 13, 10, 0.9); border-left: 4px solid; }
  </style>

  <div id="root" data-composition-id="c05b" data-width="1920" data-height="1080">
    <div class="cena">
      <div id="c05b-palco" class="palco">
        <div class="grade-mundo"></div>
        <div id="c05b-mundo"></div>
        <div class="c05b-rot" id="c05b-r-led" style="left: 820px; top: 1905px; border-color: #ef5a4c; color: #ef5a4c">LED vermelho</div>
        <div class="c05b-rot" id="c05b-r-sir" style="left: 300px; top: 1990px; border-color: #f0b545; color: #f0b545">sirene · 2 tons</div>
        <div class="c05b-rot" id="c05b-r-rel" style="left: 1290px; top: 1720px; border-color: #a8d04a; color: #a8d04a">relé · GPIO 23 → exaustor</div>
      </div>
      <div id="c05b-veu"></div>
      <div id="c05b-graf">
        <div class="rotulo">MQ-2 · fumaça e gás (0 a 4095)</div>
        <div id="c05b-valor">1600</div>
        <svg viewBox="0 0 708 440">
          <line x1="0" y1="440" x2="708" y2="440" stroke="#4b5545" stroke-width="2"/>
          <line id="c05b-lim" x1="0" x2="708" stroke="#EF5A4C" stroke-width="3" stroke-dasharray="12 8"/>
          <text id="c05b-lim-t" x="704" text-anchor="end" font-family="JetBrains Mono" font-size="18" fill="#EF5A4C">base + 800 → ALARME</text>
          <line id="c05b-base" x1="0" x2="708" stroke="#C8B88A" stroke-width="3" stroke-dasharray="4 6"/>
          <text id="c05b-base-t" x="704" text-anchor="end" font-family="JetBrains Mono" font-size="18" fill="#C8B88A">base de ar limpo</text>
          <clipPath id="c05b-corte"><rect id="c05b-corte-r" x="0" y="-60" width="0" height="560"/></clipPath>
          <g clip-path="url(#c05b-corte)">
            <path id="c05b-bruta" fill="none" stroke="#9aa08a" stroke-width="2" stroke-opacity="0.7"/>
            <path id="c05b-media" fill="none" stroke="#A8D04A" stroke-width="5" stroke-linejoin="round"/>
          </g>
          <circle id="c05b-ponto" r="9" fill="#A8D04A"/>
        </svg>
        <div id="c05b-leg"><span><i style="background: #9aa08a"></i>leitura</span><span><i style="background: #a8d04a"></i>média móvel</span><span><i style="background: #c8b88a"></i>base aprendida ao ligar</span></div>
      </div>
      <div id="c05b-alarme"><div class="t">alarme · fumaça/gás</div></div>
      <div class="cap" id="c05b-cap"><span class="ponto"></span><span class="num">05</span><span>Fumaça</span></div>
    </div>
  </div>

  <script>
    const W = (p, n) => AEGIS.w("05b", p, n);
    const FIM = AEGIS.dur("05b");
    const P = "#c05b-palco";
    const tl = gsap.timeline({ paused: true });
    const cam = (t, q, d, e) => AEGIS.camera(tl, P, t, q, d, e);
    const MX = 160, MY = 1300;
    document.querySelector("#c05b-mundo").innerHTML = AEGIS.abrigo("c05b-a");

    // ---- curva: base 1600, sobe a partir de "sobe" e cruza base+800 no "alarme"
    const BASE = 1600, LIM = BASE + 800, T_SOBE = W("sobe") - 0.2, T_CRUZA = W("alarme") - 0.1;
    const k = 800 / Math.pow(T_CRUZA - T_SOBE, 2);
    const media = (t) => (t < T_SOBE ? BASE + 25 * Math.sin(t * 1.3) : Math.min(4000, BASE + k * Math.pow(t - T_SOBE, 2)));
    const bruta = (t) => media(t) + 140 * Math.sin(t * 9.1) + 90 * Math.sin(t * 23.7 + 1) + (t > T_SOBE ? 120 * Math.sin(t * 5.3) : 0);
    const T_FIM_G = FIM - 0.6, X = (t) => (t / T_FIM_G) * 708, Y = (v) => 440 - (v / 4095) * 440;
    let dB = "", dM = "";
    for (let t = 0; t <= T_FIM_G; t += 0.05) {
      dB += `${t === 0 ? "M" : "L"}${X(t).toFixed(1)} ${Y(bruta(t)).toFixed(1)} `;
      dM += `${t === 0 ? "M" : "L"}${X(t).toFixed(1)} ${Y(media(t)).toFixed(1)} `;
    }
    document.querySelector("#c05b-bruta").setAttribute("d", dB);
    document.querySelector("#c05b-media").setAttribute("d", dM);
    for (const [id, v] of [["#c05b-lim", LIM], ["#c05b-base", BASE]]) {
      document.querySelector(id).setAttribute("y1", Y(v));
      document.querySelector(id).setAttribute("y2", Y(v));
    }
    document.querySelector("#c05b-lim-t").setAttribute("y", Y(LIM) - 10);
    document.querySelector("#c05b-base-t").setAttribute("y", Y(BASE) + 28);

    // a curva avança no tempo real da cena; valor e ponto seguem a média
    const relogio = { t: 0 };
    tl.fromTo(relogio, { t: 0 }, { t: T_FIM_G, duration: T_FIM_G, ease: "none", onUpdate: () => {
      const t = relogio.t, v = media(t);
      document.querySelector("#c05b-corte-r").setAttribute("width", X(t));
      gsap.set("#c05b-ponto", { attr: { cx: X(t), cy: Y(v), fill: v >= LIM ? "#EF5A4C" : "#A8D04A" } });
      document.querySelector("#c05b-valor").textContent = Math.round(v);
    } }, 0);
    tl.set("#c05b-media", { attr: { stroke: "#EF5A4C" } }, T_CRUZA);

    tl.set(["#c05b-alarme", "#c05b-veu", ".c05b-rot", "#c05b-a-fumaca", "#c05b-graf", ".c05b-a-tag", "#c05b-base", "#c05b-base-t"], { opacity: 0 }, 0);
    tl.set("#c05b-a-led-verde", { attr: { fill: "#A8D04A" } }, 0);
    tl.set("#c05b-a-oled", { attr: { href: "assets/img/oled-normal.png" } }, 0);

    // ---- close na cozinha e a fumaça ----------------------------------------
    AEGIS.cameraEm(tl, P, 0, { x: MX + 900, y: MY + 520, s: 0.86 });
    cam(0.1, { x: MX + 1060, y: MY + 540, s: 1.45 }, 1.3, "power3.inOut");
    tl.fromTo("#c05b-cap", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, ease: "expo.out" }, 0.3);
    tl.fromTo("#c05b-a-fumaca", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 2.5, ease: "power1.out", immediateRender: false }, W("fumaça") - 0.2);
    tl.to("#c05b-a-fumaca", { y: -40, scale: 1.08, transformOrigin: "50% 100%", duration: 5, ease: "none" }, W("fumaça") + 2.3);
    tl.fromTo("#c05b-graf", { opacity: 0, x: 80 }, { opacity: 1, x: 0, duration: 0.5, ease: "expo.out", immediateRender: false }, W("leitura") - 0.3);
    tl.fromTo(["#c05b-base", "#c05b-base-t"], { opacity: 0 }, { opacity: 1, duration: 0.3, immediateRender: false }, W("base") - 0.1);
    tl.fromTo("#c05b-base", { attr: { "stroke-width": 3 } }, { attr: { "stroke-width": 7 }, duration: 0.3, yoyo: true, repeat: 1, immediateRender: false }, W("aprendeu"));

    // ---- alarme ---------------------------------------------------------------
    const tA = T_CRUZA;
    cam(tA - 0.1, { x: MX + 720, y: MY + 560, s: 1.05 }, 0.7, "power3.inOut");
    tl.to("#c05b-graf", { x: 900, opacity: 0, duration: 0.4, ease: "power3.in" }, tA + 0.5);
    tl.fromTo("#c05b-alarme", { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power4.out", immediateRender: false }, tA);
    tl.to("#c05b-alarme", { opacity: 0, duration: 0.3 }, W("LED") + 0.2);
    for (let t = tA; t < FIM - 0.3; t += 0.5) {
      tl.set("#c05b-a-oled", { attr: { href: "assets/img/oled-alarme-fumaca.png" } }, t);
      tl.set("#c05b-a-oled", { attr: { href: "assets/img/oled-alarme-fumaca-b.png" } }, t + 0.25);
      tl.fromTo("#c05b-veu", { opacity: 0.8 }, { opacity: 0.15, duration: 0.45, immediateRender: false }, t);
    }
    tl.set("#c05b-a-led-verde", { attr: { fill: "#2a3a1c" } }, tA);
    tl.set("#c05b-a-led-verm", { attr: { fill: "#EF5A4C" } }, tA);
    tl.fromTo("#c05b-a-led-verm", { attr: { r: 9 } }, { attr: { r: 14 }, duration: 0.25, yoyo: true, repeat: 7, immediateRender: false }, W("LED"));
    tl.fromTo("#c05b-r-led", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.3, immediateRender: false }, W("LED"));
    // sirene de dois tons: as ondas alternam de cor e tamanho
    tl.set("#c05b-a-ondas", { opacity: 1 }, W("sirene") - 0.1);
    for (let t = W("sirene") - 0.1, i = 0; t < FIM - 0.3; t += 0.3, i++) {
      tl.set(["#c05b-a-onda1", "#c05b-a-onda3"], { attr: { stroke: i % 2 ? "#F0B545" : "#EF5A4C" } }, t);
      tl.set("#c05b-a-onda2", { attr: { stroke: i % 2 ? "#EF5A4C" : "#F0B545" } }, t);
      tl.fromTo("#c05b-a-ondas", { scale: 0.85, transformOrigin: "100% 50%" }, { scale: 1.15, duration: 0.28, ease: "power2.out", immediateRender: false }, t);
    }
    tl.fromTo("#c05b-r-sir", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.3, immediateRender: false }, W("sirene"));
    // relé liga o exaustor; a fumaça é puxada para fora
    cam(W("exaustor") - 0.4, { x: MX + 900, y: MY + 520, s: 0.95 }, 0.8, "power3.inOut");
    tl.to("#c05b-a-rele", { attr: { fill: "#A8D04A" }, duration: 0.1 }, W("exaustor"));
    tl.fromTo("#c05b-a-helice", { rotation: 0, svgOrigin: "1080 410" }, { rotation: 1440, svgOrigin: "1080 410", duration: FIM - W("exaustor"), ease: "power1.in", immediateRender: false }, W("exaustor"));
    tl.to("#c05b-a-fumaca", { x: 140, y: -160, scale: 0.4, opacity: 0, duration: 2.0, ease: "power2.in" }, W("exaustor") + 0.3);
    tl.fromTo("#c05b-r-rel", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.3, immediateRender: false }, W("relé") - 0.3);
    tl.to(".cena", { opacity: 0, duration: 0.3, ease: "power2.in" }, FIM - 0.35);
    window.__timelines["c05b"] = tl;
  </script>
</template>
