<!-- Cena 01 — o problema. Uma câmera só, viajando por um palco grande:
     A1 o placar dos 8,27 milhões e a vila em risco; (chicote)
     A2 os 1.600 desastres de 2024 estourando como pontos;
     B  a automação comum presa à nuvem, que cai quando a internet falha;
     (mergulho pela porta da casa)
     C  o radar do AEGIS e as três marcas; sai atravessando o radar. -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; }
    #c01-palco .num { font-size: 260px; line-height: 1; white-space: nowrap; }
    #c01-palco .num small { font-size: 100px; margin-left: 18px; }
    #c01-palco .frase { font-size: 46px; text-align: center; color: #ede4cc; }
    #c01-palco .fonte { text-align: center; }

    #c01-vila { left: 300px; top: 860px; width: 1320px; display: flex; flex-wrap: wrap; gap: 18px 26px; justify-content: center; }
    #c01-vila svg { width: 56px; height: 48px; }
    #c01-vila path { fill: rgba(200, 184, 138, 0.3); }

    #c01-pontos { left: 2440px; top: 740px; width: 1120px; display: grid; grid-template-columns: repeat(40, 1fr); gap: 10px; }
    #c01-pontos i { width: 18px; height: 18px; border-radius: 50%; background: #f0b545; display: block; }

    #c01-casa { left: 1300px; top: 2140px; width: 300px; height: 260px; }
    #c01-nuvem { left: 2380px; top: 2110px; width: 330px; height: 230px; }
    #c01-nuvem i { position: absolute; border-radius: 50%; border: 4px solid #a8d04a; background: #0d120c; }
    #c01-link-a, #c01-link-b { top: 2268px; height: 6px; background: #a8d04a; border-radius: 3px; }
    #c01-link-a { left: 1615px; width: 390px; transform-origin: 0% 50%; }
    #c01-link-b { left: 2005px; width: 370px; transform-origin: 100% 50%; }
    #c01-pacotes { left: 1615px; top: 2257px; width: 760px; height: 30px; }
    #c01-pacotes b { position: absolute; left: 0; top: 0; width: 28px; height: 28px; border-radius: 6px; background: #d6f08a; box-shadow: 0 0 16px #a8d04a; }
    #c01-chips { left: 1180px; top: 2440px; width: 540px; display: flex; gap: 16px; justify-content: center; }
    #c01-chips span { padding: 10px 20px; border: 2px solid rgba(168, 208, 74, 0.55); border-radius: 30px; font-size: 30px; color: #a8d04a; }
    #c01-rot-casa, #c01-rot-nuvem { top: 2010px; font-size: 56px; text-align: center; width: 500px; }
    #c01-rot-casa { left: 1200px; }
    #c01-rot-nuvem { left: 2295px; }
    #c01-falha { left: 1000px; top: 2560px; width: 2000px; text-align: center; font-size: 110px; }

    #c01-radar { left: 1680px; top: 3830px; width: 640px; height: 640px; }
    #c01-marca { left: 1000px; top: 4500px; width: 2000px; text-align: center; font-size: 230px; letter-spacing: 0.1em; }
    #c01-tag { left: 1000px; top: 4745px; width: 2000px; text-align: center; font-size: 34px; letter-spacing: 0.34em; }
    #c01-selos { left: 1000px; top: 4840px; width: 2000px; display: flex; justify-content: center; gap: 34px; }
    #c01-selos .selo {
      display: flex; align-items: center; gap: 16px; padding: 18px 32px;
      border: 2px solid rgba(168, 208, 74, 0.6); border-radius: 8px; background: rgba(168, 208, 74, 0.08);
      font-family: "League Gothic", sans-serif; font-size: 52px; letter-spacing: 0.08em; color: #ede4cc;
    }
    #c01-selos .selo b { color: #a8d04a; font-family: "JetBrains Mono", monospace; font-size: 32px; }

    /* sobreposição fixa (fora da câmera) */
    #c01-autor { position: absolute; right: 120px; top: 92px; text-align: right; }
    #c01-autor .nome { font-size: 48px; letter-spacing: 0.1em; }
    #c01-flash { position: absolute; inset: 0; background: #ef5a4c; mix-blend-mode: screen; }
  </style>

  <div id="root" data-composition-id="c01" data-width="1920" data-height="1080">
    <div class="cena">
      <div id="c01-palco" class="palco">
        <div class="grade-mundo"></div>

        <!-- A1 -->
        <div style="left: 160px; top: 230px; width: 1600px; text-align: center">
          <div class="num display alarme"><span id="c01-n1">0</span><small>MILHÕES</small></div>
        </div>
        <div id="c01-f1" class="frase" style="left: 160px; top: 540px; width: 1600px">de brasileiros vivem em áreas de risco de desastre</div>
        <div class="fonte rotulo" style="left: 160px; top: 620px; width: 1600px">IBGE · Cemaden</div>
        <div id="c01-vila"></div>

        <!-- A2 -->
        <div style="left: 2200px; top: 230px; width: 1600px; text-align: center">
          <div class="num display atencao"><span id="c01-n2">0</span><small>DESASTRES</small></div>
        </div>
        <div id="c01-f2" class="frase" style="left: 2200px; top: 540px; width: 1600px">registrados no Brasil só em 2024</div>
        <div id="c01-pontos"></div>
        <div class="fonte rotulo" style="left: 2200px; top: 930px; width: 1600px">cada ponto = 10 desastres · Cemaden</div>

        <!-- B -->
        <div id="c01-rot-casa" class="display caqui">automação comum</div>
        <svg id="c01-casa" viewBox="0 0 120 104"><path id="c01-casa-p" d="M60 6 L114 52 L100 52 L100 100 L20 100 L20 52 L6 52 Z" fill="#0a0d0a" stroke="#C8B88A" stroke-width="4" stroke-linejoin="round"/><rect id="c01-porta" x="50" y="66" width="20" height="34" fill="#0a0d0a" stroke="#C8B88A" stroke-width="4"/></svg>
        <div id="c01-chips"><span>luzes</span><span>clima</span><span>música</span></div>
        <div id="c01-link-a"></div><div id="c01-link-b"></div>
        <div id="c01-pacotes"><b></b><b></b><b></b><b></b></div>
        <div id="c01-rot-nuvem" class="display verde">nuvem</div>
        <div id="c01-nuvem">
          <i style="left: 20px; top: 100px; width: 110px; height: 110px"></i>
          <i style="left: 80px; top: 40px; width: 150px; height: 150px"></i>
          <i style="left: 190px; top: 70px; width: 120px; height: 120px"></i>
          <i style="left: 120px; top: 110px; width: 120px; height: 110px"></i>
          <i style="left: 60px; top: 120px; width: 90px; height: 90px"></i>
          <i style="left: 210px; top: 120px; width: 90px; height: 90px"></i>
        </div>
        <div id="c01-falha" class="display alarme">sem internet, sem proteção</div>

        <!-- C -->
        <svg id="c01-radar" viewBox="-170 -170 340 340">
          <defs>
            <radialGradient id="c01-varre-g" cx="0" cy="0" r="1" gradientUnits="objectBoundingBox">
              <stop offset="0" stop-color="#A8D04A" stop-opacity="0.6"/>
              <stop offset="1" stop-color="#A8D04A" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <circle r="160" fill="rgba(168,208,74,0.04)" stroke="#C8B88A" stroke-width="3"/>
          <circle r="112" fill="none" stroke="rgba(168,208,74,0.35)" stroke-width="1.2"/>
          <circle r="64" fill="none" stroke="rgba(168,208,74,0.35)" stroke-width="1.2"/>
          <line x1="-160" y1="0" x2="160" y2="0" stroke="rgba(168,208,74,0.3)" stroke-width="1.2"/>
          <line x1="0" y1="-160" x2="0" y2="160" stroke="rgba(168,208,74,0.3)" stroke-width="1.2"/>
          <g id="c01-varre"><path d="M0 0 L0 -158 A158 158 0 0 1 112 -112 Z" fill="url(#c01-varre-g)"/></g>
          <circle id="c01-blip1" cx="78" cy="-70" r="6" fill="#A8D04A"/>
          <circle id="c01-blip2" cx="-96" cy="40" r="5" fill="#A8D04A"/>
          <circle id="c01-blip3" cx="30" cy="104" r="5" fill="#A8D04A"/>
          <text x="0" y="40" text-anchor="middle" font-family="League Gothic" font-size="128" fill="#EDE4CC">A</text>
        </svg>
        <div id="c01-marca" class="display creme">AEGIS</div>
        <div id="c01-tag" class="rotulo verde">proteção para abrigos residenciais</div>
        <div id="c01-selos">
          <div class="selo" id="c01-s1"><b>((·))</b>funciona offline</div>
          <div class="selo" id="c01-s2"><b>{ }</b>linguagem própria</div>
          <div class="selo" id="c01-s3"><b>&gt;_</b>compilador próprio</div>
        </div>
      </div>

      <div class="cap" id="c01-cap"><span class="ponto"></span><span class="num">01</span><span>O problema</span></div>
      <div id="c01-autor">
        <div class="nome display creme" id="c01-nome">Yago Duarte</div>
        <div class="rotulo" id="c01-curso">Engenharia de Software · Ibmec</div>
      </div>
      <div id="c01-flash"></div>
    </div>
  </div>

  <script>
    const W = (p, n) => AEGIS.w("01", p, n);
    const FIM = AEGIS.dur("01");
    const P = "#c01-palco";
    const tl = gsap.timeline({ paused: true });
    const cam = (t, q, d, e) => AEGIS.camera(tl, P, t, q, d, e);

    // vila (44 casas) e pontos (160 = 1.600 desastres / 10)
    const vila = document.querySelector("#c01-vila");
    for (let i = 0; i < 44; i++)
      vila.insertAdjacentHTML("beforeend", '<svg viewBox="0 0 46 40"><path d="M23 2 L44 20 L39 20 L39 38 L7 38 L7 20 L2 20 Z"/></svg>');
    const pontos = document.querySelector("#c01-pontos");
    for (let i = 0; i < 160; i++) pontos.insertAdjacentHTML("beforeend", "<i></i>");
    const casas = gsap.utils.toArray("#c01-vila svg");
    const telhados = gsap.utils.toArray("#c01-vila path");

    tl.set(["#c01-flash", "#c01-blip1", "#c01-blip2", "#c01-blip3"], { opacity: 0 }, 0);
    tl.set(["#c01-autor"], { opacity: 0 }, 0);
    tl.fromTo("#c01-cap", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, ease: "expo.out" }, 0.15);

    // ---- A1: o placar abre em close e a câmera desce até a vila -----------
    AEGIS.cameraEm(tl, P, 0, { x: 960, y: 400, s: 1.45 });
    cam(0, { x: 960, y: 420, s: 1.3 }, W("brasileiros"), "power1.out");
    AEGIS.placar(tl, "#c01-n1", W("8") - 0.2, "8,27", 1.2);
    const f1 = AEGIS.palavras("#c01-f1");
    tl.fromTo(f1, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.15, stagger: 0.07 }, W("brasileiros"));
    cam(W("vivem") - 0.3, { x: 960, y: 700, s: 0.92 }, 1.1);
    tl.fromTo(casas, { y: -420, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power4.out", stagger: { each: 0.018, from: "center" } }, W("vivem") - 0.1);
    tl.to(telhados, { fill: "#F0B545", duration: 0.2, stagger: { each: 0.02, from: "start" } }, W("risco"));
    tl.to(telhados.filter((_, i) => i % 3 === 0), { fill: "#EF5A4C", duration: 0.15, stagger: 0.02 }, W("desastre"));
    AEGIS.tremer(tl, "#c01-vila", W("desastre"), 8, 0.3);

    // ---- A2: chicote para a direita, 1.600 pontos ---------------------------
    cam(W("E só") - 0.25, { x: 3000, y: 560, s: 1.0 }, 0.55, "power3.inOut");
    tl.fromTo("#c01-f2", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2 }, W("2024") - 0.1);
    tl.fromTo("#c01-pontos i", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.18, ease: "back.out(3)", stagger: 1.0 / 160 }, W("registrou"));
    AEGIS.placar(tl, "#c01-n2", W("1.600") - 0.3, "1.600", 1.1);
    tl.to("#c01-pontos i", { backgroundColor: "#EF5A4C", duration: 0.12, stagger: { each: 0.004, from: "end" } }, W("desastres", 1) + 0.15);

    // ---- B: a câmera desliza até a casa ligada à nuvem ----------------------
    cam(W("automação") - 0.7, { x: 2000, y: 2300, s: 1.05 }, 1.2, "power3.inOut");
    tl.fromTo("#c01-casa-p", { strokeDasharray: 420, strokeDashoffset: 420 }, { strokeDashoffset: 0, duration: 0.9, ease: "power2.out" }, W("automação"));
    tl.fromTo("#c01-rot-casa", { opacity: 0, scale: 1.12, filter: "blur(8px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, W("automação") + 0.2);
    tl.fromTo("#c01-chips span", { opacity: 0, y: 30, scale: 0.6 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "back.out(2)", stagger: 0.1 }, W("conforto") - 0.15);
    tl.fromTo("#c01-nuvem i", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(2)", stagger: 0.06 }, W("depende") - 0.1);
    tl.fromTo("#c01-rot-nuvem", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, W("depende") + 0.2);
    tl.fromTo(["#c01-link-a", "#c01-link-b"], { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power2.out" }, W("internet") - 0.15);
    const vaiVolta = W("falha") - W("internet");
    tl.set("#c01-pacotes", { opacity: 0 }, 0);
    tl.set("#c01-pacotes", { opacity: 1 }, W("internet") + 0.1);
    tl.fromTo("#c01-pacotes b", { x: -40 }, { x: 730, duration: 0.7, ease: "none", repeat: Math.ceil(vaiVolta / 0.7), stagger: 0.18 }, W("internet") + 0.1);
    // falha: a ligação quebra, a nuvem se desfaz, a tela treme
    tl.set("#c01-pacotes", { opacity: 0 }, W("falha"));
    tl.to(["#c01-link-a", "#c01-link-b"], { backgroundColor: "#EF5A4C", duration: 0.05 }, W("falha"));
    tl.to("#c01-link-a", { rotation: 38, duration: 0.6, ease: "power2.in" }, W("falha") + 0.05);
    tl.to("#c01-link-b", { rotation: -38, duration: 0.6, ease: "power2.in" }, W("falha") + 0.05);
    tl.to(["#c01-link-a", "#c01-link-b"], { opacity: 0, duration: 0.3 }, W("falha") + 0.45);
    gsap.utils.toArray("#c01-nuvem i").forEach((bolha, i) => {
      tl.to(bolha, { x: [-140, 60, 180, -60, -180, 140][i], y: [120, 180, 90, 220, 160, 200][i], opacity: 0, scale: 0.4,
        borderColor: "#6f7a66", duration: 0.9, ease: "power2.in" }, W("falha") + 0.05 + i * 0.03);
    });
    tl.to("#c01-rot-nuvem", { opacity: 0.2, duration: 0.4 }, W("falha") + 0.1);
    tl.to("#c01-chips span", { opacity: 0.12, borderColor: "#6f7a66", color: "#6f7a66", duration: 0.3, stagger: 0.05 }, W("falha") + 0.2);
    tl.set("#c01-flash", { opacity: 0.35 }, W("falha"));
    tl.to("#c01-flash", { opacity: 0, duration: 0.4, ease: "power2.out" }, W("falha") + 0.02);
    AEGIS.tremer(tl, ".cena", W("falha"), 16, 0.4);
    cam(W("falha") + 0.2, { x: 2000, y: 2400, s: 0.95 }, 0.7);
    const falha = AEGIS.palavras("#c01-falha");
    tl.fromTo(falha, { opacity: 0, scale: 1.8, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.25, ease: "power4.out", stagger: 0.09 }, W("emergência") - 0.1);

    // ---- mergulho pela porta da casa até o radar ----------------------------
    const tPorta = W("Yago") - 0.75;
    cam(tPorta, { x: 1300 + 2.5 * 60, y: 2140 + 2.5 * 83, s: 34 }, 0.65, "power3.in");
    AEGIS.cameraEm(tl, P, tPorta + 0.66, { x: 2000, y: 4150, s: 4.5 });
    cam(tPorta + 0.66, { x: 2000, y: 4320, s: 1.12 }, 1.5, "expo.out");
    tl.fromTo("#c01-varre", { rotation: 0, svgOrigin: "0 0" }, { rotation: 1080, svgOrigin: "0 0", duration: FIM - tPorta, ease: "none" }, tPorta);
    ["#c01-blip1", "#c01-blip2", "#c01-blip3"].forEach((b, i) => {
      for (let k = 0; k < 5; k++) {
        const t = tPorta + 1.2 + i * 0.9 + k * 2.4;
        tl.fromTo(b, { opacity: 1, scale: 1.6, svgOrigin: "0 0" }, { opacity: 0, scale: 1, duration: 1.4, ease: "power2.out", immediateRender: false }, t);
      }
    });
    const nome = AEGIS.letras("#c01-nome");
    tl.set("#c01-autor", { opacity: 1 }, W("Yago"));
    tl.fromTo(nome, { opacity: 0.0, filter: "blur(4px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.12, stagger: 0.05 }, W("Yago"));
    tl.fromTo("#c01-curso", { opacity: 0 }, { opacity: 1, duration: 0.4 }, W("Yago") + 0.5);
    const marca = AEGIS.letras("#c01-marca");
    tl.fromTo(marca, { opacity: 0, y: 80, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "expo.out", stagger: 0.08 }, W("AEGIS") - 0.15);
    cam(W("proteção") - 0.2, { x: 2000, y: 4440, s: 0.78 }, 1.2);
    tl.fromTo("#c01-tag", { opacity: 0, scale: 1.12, filter: "blur(8px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.8, ease: "expo.out" }, W("proteção"));
    [["#c01-s1", "sem internet"], ["#c01-s2", "linguagem"], ["#c01-s3", "compilador"]].forEach(([s, p]) => {
      tl.fromTo(s, { opacity: 0, scale: 0.4, filter: "blur(8px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.45, ease: "back.out(1.6)" }, W(p) - 0.1);
    });

    // ---- saída: atravessa o centro do radar ---------------------------------
    tl.to("#c01-autor", { opacity: 0, duration: 0.2 }, FIM - 0.7);
    cam(FIM - 0.6, { x: 2000, y: 4150, s: 14 }, 0.6, "power3.in");
    tl.to(".cena", { opacity: 0, duration: 0.2, ease: "power2.in" }, FIM - 0.25);
    window.__timelines["c01"] = tl;
  </script>
</template>
