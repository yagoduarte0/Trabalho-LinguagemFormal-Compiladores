    const W = (p, n) => AEGIS.w("07", p, n);

    const tl = gsap.timeline({ paused: true });
    const cam = (t, q, d, e) => AEGIS.camera(tl, P, t, q, d, e);
    const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");

    // terminal com a saída real dos cenários
    const term = document.querySelector("#c07-term-l");
    D.cenarios.forEach((l, i) => term.insertAdjacentHTML("beforeend",
      `<div class="lt" id="c07-lt${i}">${esc(l).replace(/^OK/, "<b>OK</b>").replace(/(\d+\/\d+ cenarios passaram\.)/, "<b>$1</b>")}</div>`));
    const rede = D.cenarios.map((l, i) => (/painel|Telegram/.test(l) ? i : -1)).filter((i) => i >= 0);

    // diário: as linhas reais do avaliar() e a leitura de cada uma
    const leitura = {
      "risco_presenca == ALARME": "se houver intruso → ALARME",
      "risco_agua == ALARME": "se a água subir → ENCHENTE",
      "deslizamento": "chuva + solo → DESLIZAMENTO",
      "risco_fumaca == ALARME": "fumaça vence tudo → FUMAÇA/GÁS",
    };
    const linhas = D.firmware.avaliarFim.html.map((h) => h.replace(/<[^>]+>/g, "").replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">"));
    const ents = document.querySelector("#c07-ents");
    let k = 0;
    linhas.forEach((l) => {
      const m = /checkpoint \((.*)\) \{/.exec(l);
      if (!m) return;
      const motivo = (linhas[linhas.indexOf(l) + 2] || "").trim();
      ents.insertAdjacentHTML("beforeend",
        `<div class="ent" id="c07-e${k}" style="top:${140 + k * 150}px"><div class="c"><b>checkpoint</b> (${esc(m[1])}) {\n    ${esc(motivo)}\n}</div><div class="p">${leitura[m[1]] || ""}</div></div>`);
      k++;
    });

    tl.set(["#c07-41", ".ent", "#c07-arq", ".c07-alvo", ".c07-fio", "#c07-p1", "#c07-p2", "#c07-radar", "#c07-marca", "#c07-obr", "#c07-assina"], { opacity: 0 }, 0);

    // ---- T: os 41 cenários ----------------------------------------------------

    cam(0.1, { x: 960, y: 520, s: 1.0 }, 1.2, "expo.out");
    tl.fromTo("#c07-cap", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, ease: "expo.out" }, 0.3);
    const rolar = D.cenarios.length * 40 - 600;
    tl.fromTo("#c07-term-l", { y: 0 }, { y: -rolar, duration: W("incluindo") - 0.5, ease: "power1.inOut" }, 0.5);
    tl.to("#c07-41", { opacity: 1, duration: 0.3 }, W("41") - 0.25);
    AEGIS.placar(tl, "#c07-41-v", W("41") - 0.2, "41", 1.0);
    tl.to("#c07-41", { opacity: 0, duration: 0.3 }, W("incluindo") - 0.2);
    rede.forEach((i, j) => tl.to(`#c07-lt${i}`, { backgroundColor: "rgba(168, 208, 74, 0.22)", duration: 0.2 }, W("servidor") + j * 0.12));

    // ---- D: diário de operação ------------------------------------------------
    cam(W("Com o") - 0.4, { x: 3150, y: 520, s: 1.0 }, 0.8, "power3.inOut");
    gsap.utils.toArray(".ent").forEach((e, i) => {
      tl.fromTo(e, { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.35, ease: "expo.out", immediateRender: false }, W("regras") + i * 0.5);
    });

    // ---- M: o mesmo código no simulador e na placa ----------------------------
    cam(W("E o mesmo") - 0.4, { x: 4650, y: 520, s: 0.95 }, 0.8, "power3.inOut");
    tl.fromTo("#c07-arq", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)", immediateRender: false }, W("código") - 0.2);
    tl.fromTo(".c07-fio", { opacity: 1, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.45, ease: "power2.out", immediateRender: false }, W("roda no simulador") - 0.1);
    tl.fromTo("#c07-sim", { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out", immediateRender: false }, W("simulador"));
    tl.fromTo("#c07-placa", { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out", immediateRender: false }, W("placa"));

    // ---- F: próximos passos e o fim -------------------------------------------

    tl.fromTo("#c07-passos .t", { opacity: 0, letterSpacing: "0.3em" }, { opacity: 1, letterSpacing: "0.06em", duration: 0.6, ease: "expo.out" }, W("próximos") - 0.2);
    tl.fromTo("#c07-p1", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out", immediateRender: false }, W("análise") - 0.2);
    tl.fromTo("#c07-p2", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out", immediateRender: false }, W("montagem") - 0.2);
    // obrigado: a câmera desce até o radar
    const tO = W("Obrigado") - 0.6;
    cam(tO, { x: 960, y: 2800 + 540, s: 1.0 }, 0.9, "power3.inOut");
    tl.fromTo("#c07-radar", { opacity: 0, scale: 0.6, rotation: -40 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.8, ease: "power3.out", immediateRender: false }, tO + 0.3);
    tl.fromTo("#c07-varre", { rotation: 0, svgOrigin: "0 0" }, { rotation: 720, svgOrigin: "0 0", duration: FIM - tO, ease: "none" }, tO);
    tl.fromTo("#c07-marca", { opacity: 0, letterSpacing: "0.5em" }, { opacity: 1, letterSpacing: "0.12em", duration: 0.8, ease: "expo.out", immediateRender: false }, tO + 0.5);
    tl.fromTo("#c07-obr", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out", immediateRender: false }, W("Obrigado"));
    tl.fromTo("#c07-assina", { opacity: 0 }, { opacity: 1, duration: 0.6, immediateRender: false }, W("Obrigado") + 0.4);
