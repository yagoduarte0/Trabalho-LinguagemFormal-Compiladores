      ["esp", 326.0, 336.0],
      ["solo", 380.5, 410.0], ["pir", 412.0, 423.3], ["chuva", 437.5, 486.6],
      ["buzzer", 446.0, 493.4], ["botao", 490.5, 499.0], ["solo", 521.0, 526.0], ["chuva", 530.0, 546.0],

      tl.to(`#it-${id} .realce`, { opacity: 1, duration: 0.3, ease: "power2.out" }, a);

    });

    // painel de estado: só na demonstração
    tl.fromTo("#estado", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 324.2);
    tl.to("#estado", { opacity: 0, duration: 0.6 }, 556.4);

    const COR = { ligando: "rgba(237, 228, 204, 0.3)", normal: "#a8d04a", atencao: "#f0b545", alarme: "#ef5a4c" };
    const ESTADOS = [
      ["ligando", 324.2, 336.0, "ligando"], ["normal1", 336.0, 398.6, "normal"],
      ["atencao1", 398.6, 446.0, "atencao"], ["alarme", 446.0, 493.6, "alarme"],

      ["normal2", 546.0, 557.03, "normal"],
    ];

      tl.fromTo(`#est-${id}`, { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.35, ease: "power2.out", immediateRender: false }, a);
      tl.to(`#est-${id}`, { opacity: 0, duration: 0.25 }, b - 0.25);
      tl.to("#estado-luz", { backgroundColor: COR[cor], boxShadow: `0 0 18px ${COR[cor]}`, duration: 0.3 }, a);
    });
    // no alarme a luz pisca, como o LED vermelho
    for (let t = 446.0; t < 493.0; t += 1.0) {
      tl.to("#estado-luz", { opacity: 0.25, duration: 0.25 }, t + 0.5);
      tl.to("#estado-luz", { opacity: 1, duration: 0.25 }, t + 0.75);
    }
