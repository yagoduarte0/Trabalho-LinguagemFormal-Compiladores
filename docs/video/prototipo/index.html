<!doctype html>
<!-- Vídeo do protótipo físico: a gravação cortada (assets/base.mp4, gerada por
     docs/video/edicao/prototipo_cortes.py) ocupa a direita da tela; a barra
     lateral, as fichas dos componentes, a abertura e o fim são animados por cima.
     Os tempos das cenas vêm de assets/cortes.json. -->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0a0d0a; }
      #root { width: 100%; height: 100%; position: relative; font-family: "Inter", sans-serif; }
      #filme { position: absolute; left: 300px; top: 0; width: 1620px; height: 1080px; object-fit: cover; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="607.33"
      data-width="1920" data-height="1080">

      <video id="filme" class="clip" src="assets/base.mp4" data-start="0" data-duration="602.33"
        data-track-index="0" data-has-audio="true"></video>

      <div id="lateral" data-composition-id="lateral" data-composition-src="compositions/lateral.html"
        data-start="0" data-duration="602.33" data-track-index="1"
        data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <div id="fichas" data-composition-id="fichas" data-composition-src="compositions/fichas.html"
        data-start="0" data-duration="602.33" data-track-index="2"
        data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <div id="abertura" data-composition-id="abertura" data-composition-src="compositions/abertura.html"
        data-start="0" data-duration="6" data-track-index="3"
        data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <div id="fim" data-composition-id="fim" data-composition-src="compositions/fim.html"
        data-start="600.33" data-duration="7" data-track-index="4"
        data-track-kind="graphics" data-width="1920" data-height="1080"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
