<!doctype html>
<!-- Modelo da raiz do vídeo. O docs/video/animacao/index.html é gerado a partir dele por
     docs/video/edicao/montar.py, que preenche as cenas, os áudios e a duração. -->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="assets/tempos.js"></script>
    <script src="assets/dados.js"></script>
    <script src="assets/aegis.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0a0d0a;
      }
      #root { width: 100%; height: 100%; position: relative; }
      /* tema.css entra aqui inteiro (o HyperFrames só embute as fontes citadas no HTML) */
/* TEMA */
      /* HUD fixo: vinheta e cantos de mira, como no pitch (a grade fica no
         palco de cada cena, para andar com a câmera) */
      #fundo { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
      #fundo .vinheta {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 45%, transparent 40%, rgba(0, 0, 0, 0.55) 100%);
      }
      #fundo .canto { position: absolute; width: 56px; height: 56px; border-color: rgba(200, 184, 138, 0.55); border-style: solid; }
      #fundo .ce { left: 48px; top: 40px; border-width: 2px 0 0 2px; }
      #fundo .cd { right: 48px; top: 40px; border-width: 2px 2px 0 0; }
      #fundo .be { left: 48px; bottom: 40px; border-width: 0 0 2px 2px; }
      #fundo .bd { right: 48px; bottom: 40px; border-width: 0 2px 2px 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DURACAO}}"
      data-width="1920" data-height="1080" data-motion-blur="on">
      <div id="fundo" data-layout-ignore>
        <div class="vinheta"></div>
        <div class="canto ce"></div><div class="canto cd"></div>
        <div class="canto be"></div><div class="canto bd"></div>
      </div>

<!-- CENAS -->

      <div id="legendas" data-composition-id="legendas" data-composition-src="compositions/legendas.html"
        data-start="0" data-duration="{{DURACAO}}" data-track-index="3" data-track-kind="captions"
        data-width="1920" data-height="1080" style="z-index: 10"></div>

<!-- AUDIOS -->
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
